<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14110F" />
    <meta name="color-scheme" content="light" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700&display=swap"
      />
    </noscript>

    <title>Studioz D — Photography, Films &amp; Personalized Gifts</title>
    <meta
      name="description"
      content="Studioz D is a creative photography and personalized-gifting studio. We capture weddings, portraits, events and products, then turn those memories into gifts made from your story."
    />

    <style>
      /* Anti-FOUC baseline. Keeps first paint on-brand and prevents the
         layout shift that a late stylesheet would otherwise cause. */
      html {
        background-color: #fdfbf7;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background-color: #fdfbf7;
        color: #14110f;
        font-family: Manrope, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        min-height: 100svh;
      }
      #root {
        isolation: isolate;
        min-height: 100svh;
      }
      .boot-veil {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fdfbf7;
        z-index: 9999;
      }
      .boot-veil span {
        font-family: Georgia, 'Times New Roman', serif;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        font-size: 0.72rem;
        color: #766b63;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-veil" role="status" aria-live="polite"><span>Studioz D</span></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <noscript>
      <div style="padding: 2rem; font-family: Manrope, sans-serif">
        <h1 style="font-family: Georgia, serif">Studioz D</h1>
        <p>
          This site needs JavaScript enabled. Please enable it, or reach us directly to talk about a
          shoot or a personalized gift.
        </p>
      </div>
    </noscript>
  </body>
</html>
